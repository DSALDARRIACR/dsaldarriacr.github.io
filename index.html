<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#04060f" />
  <title>Flores amarillas 🌻</title>
  <meta name="description" content="Un pequeño jardín de flores amarillas hecho con HTML, CSS y JavaScript. Sin regar, sin marchitarse." />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Feliz día de las flores amarillas 🌻" />
  <meta property="og:description" content="Comprar flores era demasiado fácil... así que las programé." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=Outfit:wght@300;400;600&family=JetBrains+Mono&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.92em%22 font-size=%2292%22>🌻</text></svg>" />

  <!-- Si estás leyendo esto, eres demasiado curiosa 😂 -->
</head>

<body>

  <!-- ===== Fondo nocturno ===== -->
  <div class="scene" aria-hidden="true">
    <div class="scene__sky"></div>
    <div class="scene__stars" id="stars"></div>
    <div class="scene__fireflies" id="fireflies"></div>
    <div class="scene__horizon"></div>
    <div class="scene__vignette"></div>
  </div>

  <!-- ===== Pétalos cayendo (se llena desde JS) ===== -->
  <div class="petal-rain" id="petalRain" aria-hidden="true"></div>

  <main class="stage">

    <!-- ===== 1. Intro ===== -->
    <section class="intro" id="intro" aria-label="Introducción">
      <p class="intro__line" id="introLine" role="status" aria-live="polite"></p>

      <button class="btn btn--primary intro__cta is-away" id="startBtn" type="button">
        Ver tus flores 🌻
      </button>

      <button class="btn btn--ghost intro__skip" id="skipBtn" type="button">
        saltar intro
      </button>
    </section>

    <!-- ===== 2. Jardín ===== -->
    <section class="garden" id="garden" aria-label="Jardín de flores amarillas" hidden>
      <p class="garden__hint" id="gardenHint">toca una flor 👆</p>
      <div class="garden__field" id="field"></div>
    </section>

    <!-- ===== 3. Momento especial ===== -->
    <section class="finale" id="finale" aria-label="Mensaje final" hidden>
      <div class="finale__card">
        <div class="finale__lines" id="finaleLines" role="status" aria-live="polite"></div>
        <button class="btn btn--primary finale__cta is-away" id="lastBtn" type="button">
          Hay una última cosa 👀
        </button>
      </div>
    </section>

  </main>

  <!-- ===== Tarjetas flotantes de las flores ===== -->
  <div class="tooltips" id="tooltips" aria-live="polite"></div>

  <!-- ===== Detalles de esquina ===== -->
  <p class="corner-code" aria-hidden="true">console.log(<span>"Flores amarillas generadas correctamente 🌻"</span>);</p>

  <div class="audio-dock is-away" id="audioDock">
    <button class="btn btn--chip" id="audioBtn" type="button" aria-pressed="false">🔊 Música</button>
  </div>

  <audio id="bgm" src="assets/audio/musica.mp3" loop preload="none"></audio>

  <script src="js/app.js" defer></script>
</body>
</html>
